<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tamil Marketing — Grow Your Visibility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1520;
    --page-bg-1:#0f2233;
    --page-bg-2:#060d13;
    --surface:#122335;
    --surface-2:#182f45;
    --surface-3:#1f3b56;
    --accent:#1ea982;
    --accent-strong:#178c6c;
    --accent-soft:#122e29;
    --warn:#d99a3d;
    --warn-soft:#2e2517;
    --text:#eef4f6;
    --text-muted:#8ea3b3;
    --border:#213b52;
    --border-light:rgba(255,255,255,0.08);
    --radius-lg:28px;
    --radius-md:16px;
    --danger:#e0755e;
    --danger-soft:#301b17;
    --info:#5aa9e6;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}

  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(circle at 20% 0%, var(--page-bg-1), transparent 60%),
      var(--page-bg-2);
    font-family:'Sora',sans-serif;
    color:var(--text);
  }

  .phone{
    width:100%;
    max-width:420px;
    background:var(--bg);
    border-radius:var(--radius-lg);
    border:1px solid var(--border);
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.75);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    height:min(760px, 94vh);
  }

  /* Mobile Fullscreen Optimization */
  @media (max-width: 640px) {
    body {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
      background: var(--bg);
      height: 100dvh;
      overflow: hidden;
    }
    .phone {
      max-width: 100%;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
    .app-header {
      padding-top: calc(14px + env(safe-area-inset-top, 0px)) !important;
    }
    .tab-bar {
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important;
    }
    .checkout-bar {
      bottom: calc(49px + env(safe-area-inset-bottom, 0px)) !important;
    }
    .modal {
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)) !important;
    }
  }

  /* ---------- header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:20px 22px 8px;
    flex-shrink:0;
  }
  .brand-group{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:34px;height:34px;
    border-radius:10px;
    background:var(--accent);
    color:#06140f;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 2px 10px rgba(30,169,130,0.3);
  }
  .brand-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .auth-btn{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    font-weight:600;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:100px;
    cursor:pointer;
    font-family:'Sora',sans-serif;
    transition:border-color 160ms, color 160ms;
  }
  .auth-btn:hover{ border-color:var(--accent); }
  .auth-btn svg{ width:12px;height:12px; }
  .trust-pill{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:5px 9px;
    border-radius:100px;
  }
  .trust-pill svg{ width:11px;height:11px; flex-shrink:0; }

  /* ---------- pages ---------- */
  .pages{ flex:1; min-height:0; position:relative; overflow:hidden; }
  .page{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:0 0 80px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--bg);
    opacity:0;
    transform:translateY(6px);
    pointer-events:none;
    transition:opacity 200ms ease, transform 200ms ease;
  }
  .page.active{ opacity:1; transform:translateY(0); pointer-events:auto; }

  .hero{ padding:14px 22px 18px; flex-shrink:0; }
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:27px;
    margin:0 0 4px;
    letter-spacing:-0.4px;
  }
  .hero p{
    font-size:13px;
    color:var(--text-muted);
    margin:0;
    line-height:1.45;
  }

  /* ---------- segmented control ---------- */
  .segmented{
    position:relative;
    display:flex;
    margin:0 22px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:4px;
    flex-shrink:0;
  }
  .seg-highlight{
    position:absolute;
    top:4px; left:4px;
    width:calc(33.333% - 2.66px);
    height:calc(100% - 8px);
    background:var(--accent);
    border-radius:10px;
    transition:transform 320ms cubic-bezier(.32,.72,0,1);
    z-index:0;
    box-shadow:0 2px 8px rgba(30,169,130,0.35);
  }
  .seg-btn{
    position:relative; z-index:1; flex:1;
    border:none; background:transparent;
    color:var(--text-muted);
    font-family:'Sora',sans-serif;
    font-weight:600; font-size:13.5px;
    padding:10px 4px; border-radius:10px; cursor:pointer;
    transition:color 200ms ease;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .seg-btn svg{ width:14px; height:14px; flex-shrink:0; }
  .seg-btn.active{ color:#06140f; }

  /* ---------- Tier List & Inline Expansion ---------- */
  .list-wrap{ padding:18px 22px 4px; }
  .list-caption{ font-size:12.5px; color:var(--text-muted); margin:0 2px 10px; }
  .tier-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  
  .tier-item{
    list-style:none;
    border-bottom:1px solid var(--border);
    transition:all 220ms ease;
  }
  .tier-item:last-child{ border-bottom:none; }

  .tier-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 4px;
    cursor:pointer; background:transparent;
    width:100%; text-align:left; color:var(--text);
    font-family:'Sora',sans-serif;
    transition:background 160ms ease;
  }
  .tier-row:active{ background:rgba(255,255,255,0.02); }
  
  .tier-left{ display:flex; align-items:center; gap:12px; }
  .tier-icon{
    width:36px; height:36px; border-radius:11px;
    background:var(--surface); border:1px solid var(--border);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-muted);
    transition:background 180ms ease, color 180ms ease, border-color 180ms ease;
  }
  .tier-icon svg{ width:17px; height:17px; }
  
  .tier-item.selected .tier-icon{
    background:var(--accent); border-color:var(--accent); color:#06140f;
  }
  .tier-item.selected .tier-row{
    padding-bottom:10px;
  }
  .tier-item.selected .tier-qty{
    color:var(--text); font-weight:700;
  }

  .tier-qty{ font-weight:600; font-size:15px; }
  .tier-price{ font-weight:700; font-size:15px; white-space:nowrap; }

  /* Accordion Inline Expansion Box */
  .tier-expand-box{
    animation:expandDown 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
    background:rgba(18, 35, 53, 0.82);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(30, 169, 130, 0.35);
    border-radius:14px;
    padding:14px 15px 15px;
    margin:0 0 14px;
    box-shadow:0 8px 24px -6px rgba(0,0,0,0.45);
  }
  @keyframes expandDown{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .tier-est-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border:1px solid rgba(30,169,130,0.25);
    padding:4px 10px; border-radius:100px;
  }
  .tier-perks-row{
    display:flex; gap:14px; font-size:11.5px; color:var(--text-muted);
    margin:10px 0 12px; flex-wrap:wrap;
  }
  .tier-continue-btn{
    width:100%;
    background:var(--accent);
    color:#06140f;
    border:none;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:12px 14px;
    border-radius:11px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(30, 169, 130, 0.35);
    transition:transform 120ms ease;
  }
  .tier-continue-btn:active{ transform:scale(0.98); }

  .list-anim-enter{ animation:listIn 240ms ease both; }
  @keyframes listIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  .custom-panel{
    padding:14px 4px 18px;
    border-bottom:1px solid var(--border);
    animation:listIn 220ms ease both;
  }
  .custom-price-preview{
    font-size:13px; color:var(--text-muted);
    margin:2px 0 4px;
  }
  .custom-price-preview.valid{ color:var(--text); }
  .custom-price-preview strong{ color:var(--accent); font-family:'Fraunces',serif; }
  .custom-panel .primary-btn{ margin-top:8px; }

  /* ---------- orders page ---------- */
  .orders-header{ padding:20px 22px 10px; flex-shrink:0; }
  .orders-header h1{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; }
  
  .user-status-card{
    margin-top:10px; padding:10px 14px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; font-size:12px; color:var(--text-muted);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .user-status-left{ display:flex; align-items:center; gap:8px; min-width:0; }
  .user-status-icon{ width:16px; height:16px; color:var(--accent); flex-shrink:0; }
  .user-status-text{ font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-status-text small{ display:block; color:var(--text-muted); font-size:10.5px; }
  .user-status-btn{
    background:none; border:none; color:var(--accent);
    font-family:'Sora',sans-serif; font-size:11.5px; font-weight:600;
    cursor:pointer; flex-shrink:0; padding:4px 0;
  }

  .orders-lookup{ padding:4px 22px 14px; flex-shrink:0; }
  .orders-lookup .field-label{ margin-bottom:5px; font-size:12px; }
  .lookup-row{ display:flex; gap:8px; }
  .lookup-row .field-input{ margin-bottom:0; flex:1; }
  .lookup-row .primary-btn{ margin-top:0; width:auto; padding:12px 16px; white-space:nowrap; font-size:13.5px; }
  
  .order-list{ list-style:none; margin:0; padding:0 22px 18px; display:flex; flex-direction:column; gap:12px; }
  .order-card{
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:16px;
    padding:14px 16px;
    position:relative;
  }
  .order-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .order-id-bar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .order-id-display{
    font-family:'Fraunces',serif; font-size:13.5px; font-weight:700;
    color:var(--accent); letter-spacing:0.5px; display:flex; align-items:center; gap:6px;
  }
  .copy-btn{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-muted); font-size:11px; font-weight:600;
    padding:3px 8px; border-radius:6px; cursor:pointer;
    font-family:'Sora',sans-serif;
    transition:all 140ms ease;
  }
  .copy-btn:hover{ border-color:var(--accent); color:var(--text); }
  .copy-btn.copied{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .copy-btn svg{ width:11px; height:11px; }

  .order-qty{ font-weight:600; font-size:14.5px; }
  .order-price{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
  .order-meta{ margin-top:3px; font-size:12px; color:var(--text-muted); }
  .order-target{ margin-top:8px; font-size:12.5px; color:var(--text-muted); word-break:break-all; }
  .order-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .order-date{ font-size:11.5px; color:var(--text-muted); }
  .status-badge{
    font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:100px;
  }
  .status-processing{ color:var(--warn); background:var(--warn-soft); }
  .status-completed{ color:var(--accent); background:var(--accent-soft); }

  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 30px; text-align:center; color:var(--text-muted);
  }
  .empty-state .empty-icon{ margin-bottom:12px; opacity:0.7; }
  .empty-state p{ margin:0; font-size:13.5px; line-height:1.5; }

  /* ---------- checkout bar with glassmorphism ---------- */
  .checkout-bar{
    position:absolute;
    bottom:49px;
    left:0; right:0;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 22px;
    background:rgba(24, 47, 69, 0.88);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-top:1px solid rgba(255,255,255,0.1);
    transform:translateY(100%);
    opacity:0;
    pointer-events:none;
    transition:transform 300ms cubic-bezier(.32,.72,0,1), opacity 200ms ease;
    z-index:6;
    box-shadow:0 -8px 24px rgba(0,0,0,0.3);
  }
  .checkout-bar.visible{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto;
  }
  .checkout-info{ display:flex; flex-direction:column; min-width:0; }
  .checkout-label{ font-size:11.5px; color:var(--text-muted); }
  .checkout-price{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; }
  .checkout-btn{
    background:var(--accent); color:#06140f; border:none;
    font-family:'Sora',sans-serif; font-weight:700; font-size:14px;
    padding:12px 20px; border-radius:12px; cursor:pointer; flex-shrink:0;
    transition:transform 120ms ease, box-shadow 120ms ease;
    box-shadow:0 4px 14px rgba(30,169,130,0.35);
  }
  .checkout-btn:active{ transform:scale(0.96); }

  /* ---------- bottom tab bar ---------- */
  .tab-bar{
    display:flex;
    border-top:1px solid var(--border);
    background:var(--bg);
    flex-shrink:0;
    z-index:7;
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:11px 4px 13px;
    background:none; border:none; cursor:pointer;
    color:var(--text-muted);
    font-family:'Sora',sans-serif; font-size:11px; font-weight:600;
  }
  .tab-btn svg{ width:20px; height:20px; }
  .tab-btn.active{ color:var(--accent); }

  /* ---------- modals & glass styling ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(4,8,12,0.76);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 220ms ease;
    z-index:20;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:420px;
    background:rgba(11, 21, 32, 0.96);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:24px 24px 0 0;
    padding:24px 24px 28px;
    transform:translateY(30px);
    transition:transform 260ms cubic-bezier(.32,.72,0,1);
    max-height:88vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    box-shadow:0 -12px 40px rgba(0,0,0,0.6);
  }
  .modal-backdrop.open .modal{ transform:translateY(0); }

  .modal-back{
    display:flex; align-items:center; gap:6px;
    background:none; border:none; color:var(--text-muted);
    font-family:'Sora',sans-serif; font-size:13px; font-weight:600;
    padding:0 0 14px; cursor:pointer;
  }
  .modal-back svg{ width:15px; height:15px; }

  .modal h2{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin:0 0 4px; }
  .modal p.modal-sub{ color:var(--text-muted); font-size:13px; margin:0 0 16px; line-height:1.5; }

  .field-label{ font-size:12.5px; font-weight:600; color:var(--text-muted); margin:0 0 7px; display:block; }
  .field-input{
    width:100%;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    color:var(--text);
    font-family:'Sora',sans-serif;
    font-size:14px;
    margin-bottom:6px;
    transition:border-color 160ms ease;
  }
  .field-input:focus{ outline:none; border-color:var(--accent); }
  .field-hint{ font-size:11.5px; color:var(--text-muted); margin:0 0 16px; }
  .field-error{ font-size:11.5px; color:#e0755e; margin:-2px 0 14px; min-height:14px; }

  .modal-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:9px 0; border-bottom:1px solid var(--border); }
  .modal-row .label{ color:var(--text-muted); }
  .modal-row .value{ text-align:right; max-width:65%; word-break:break-all; font-weight:500; }
  .modal-total{ display:flex; justify-content:space-between; padding:14px 0 4px; font-family:'Fraunces',serif; font-weight:600; font-size:18px; }

  .primary-btn{
    width:100%; margin-top:16px;
    background:var(--accent); color:#06140f; border:none;
    font-family:'Sora',sans-serif; font-weight:700; font-size:14.5px;
    padding:15px; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 4px 16px rgba(30,169,130,0.3);
    transition:transform 120ms ease, opacity 120ms ease;
  }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.7; cursor:default; }
  
  .glass-btn{
    background:linear-gradient(135deg, rgba(30,169,130,0.95), rgba(23,140,108,0.95)) !important;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.12) !important;
  }

  .secondary-btn{
    display:block; width:100%; text-align:center; margin-top:10px;
    background:none; border:none; color:var(--text-muted);
    font-family:'Sora',sans-serif; font-size:13px; padding:8px; cursor:pointer;
  }
  .secure-note{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:14px; font-size:11.5px; color:var(--text-muted);
  }
  .secure-note svg{ width:12px;height:12px; }

  .spinner{
    width:16px;height:16px; border-radius:50%;
    border:2px solid rgba(6,20,15,0.35); border-top-color:#06140f;
    animation:spin 700ms linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Logged in badge */
  .user-badge-banner{
    display:flex; align-items:center; gap:10px;
    background:var(--accent-soft); border:1px solid rgba(30,169,130,0.3);
    border-radius:12px; padding:10px 14px; margin-bottom:16px;
  }
  .user-badge-banner svg{ color:var(--accent); width:18px; height:18px; flex-shrink:0; }
  .user-badge-title{ font-size:11.5px; color:var(--accent); font-weight:600; }
  .user-badge-email{ font-size:13px; font-weight:600; color:var(--text); }

  /* Terms & Conditions */
  .terms-group{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    margin:14px 0 16px;
  }
  .terms-label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:12.5px;
    color:var(--text);
    cursor:pointer;
    line-height:1.4;
  }
  .terms-label input[type="checkbox"]{
    margin-top:2px;
    accent-color:var(--accent);
    width:16px;
    height:16px;
    cursor:pointer;
    flex-shrink:0;
  }

  // ---- Audio Synthesizer: Paytm / GPay-style Success Chime ----
  function playSuccessChime() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      if (ctx.state === 'suspended') ctx.resume();

      const playTone = (freq, start, dur, vol) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(vol, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur);
      };

      const now = ctx.currentTime;
      // Melodic, rich harmonic chime (D5 -> F#5 -> A5 -> D6)
      playTone(587.33, now + 0.00, 0.28, 0.22);
      playTone(739.99, now + 0.09, 0.32, 0.24);
      playTone(880.00, now + 0.18, 0.42, 0.28);

  function calcCustomPrice(cat, qtyNum){
    const tiers = DATA[cat].tiers.slice().sort((a,b) => a.qtyNum - b.qtyNum);

    if(qtyNum >= tiers[tiers.length-1].qtyNum) return tiers[tiers.length-1].price;

      const a = tiers[i], b = tiers[i+1];
      if(qtyNum >= a.qtyNum && qtyNum <= b.qtyNum){
        const ratio = (qtyNum - a.qtyNum) / (b.qtyNum - a.qtyNum);
        return Math.round(a.price + ratio * (b.price - a.price));

  // ---- Target validation and normalization helper ----
  function parseTarget(cat, rawInput){
    const input = (rawInput || "").trim();
    if(cat === "followers"){
      let username = input;
      let url = input;
      if(input.includes("instagram.com/")){
        const match = input.match(/instagram\.com\/([a-zA-Z0-9._]+)/i);
        if(match && match[1]){
          username = match[1];
        } else {
          username = input.split("instagram.com/")[1].split("/")[0].split("?")[0];
        }
      }
      username = username.replace(/^@/, "").replace(/\/+$/, "");
      url = `https://www.instagram.com/${username}/`;
      const isValid = /^[a-zA-Z0-9._]{1,30}$/.test(username);
      return {
        targetUsername: `@${username}`,
        targetUrl: url,
        isValid: isValid,
        error: isValid ? "" : "Please enter a valid Instagram username or profile link (e.g. @yourusername or instagram.com/username)."
      };
    } else if(cat === "views"){
      let url = input;
      if(!url.startsWith("http://") && !url.startsWith("https://")){
        url = "https://" + url;
      }
      // Reel-specific link validation
      const isReel = /instagram\.com\/(reel|reels)\/[a-zA-Z0-9_-]+/i.test(url) || /instagram\.com\/[^\s/]+\/(reel|reels)\/[a-zA-Z0-9_-]+/i.test(url);
      const isValid = isReel && url.length > 18;
      return {
        targetUsername: "",
        targetUrl: url,
        isValid: isValid,
        error: isValid ? "" : "Please enter a valid Instagram Reel URL (e.g. https://www.instagram.com/reel/...)."
      };
    } else { // likes
      let url = input;
      if(!url.startsWith("http://") && !url.startsWith("https://")){
        url = "https://" + url;
      }
      // Post or reel link validation
      const isPostOrReel = /instagram\.com\/(p|reel|reels|tv)\/[a-zA-Z0-9_-]+/i.test(url) || /instagram\.com\/[^\s/]+\/(p|reel|reels)\/[a-zA-Z0-9_-]+/i.test(url);
      const isValid = isPostOrReel && url.length > 18;
      return {
        targetUsername: "",
        targetUrl: url,
        isValid: isValid,
        error: isValid ? "" : "Please enter a valid Instagram Post or Reel URL (e.g. https://www.instagram.com/p/... or /reel/...)."
      };
    }
  }

      <button class="modal-back" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <h2>Confirm your order</h2>
      <p class="modal-sub">Review delivery target and payment details.</p>
      
      <div class="modal-row"><span class="label">Service</span><span class="value">Instagram ${cat.label}</span></div>
      <div class="modal-row"><span class="label">Quantity</span><span class="value">${selection.qty}</span></div>
      <div class="modal-row"><span class="label">Est. Delivery</span><span class="value tier-est-pill" style="display:inline-block; font-size:11px;">⏱️ ${cat.estTime}</span></div>
      ${parsed && parsed.targetUsername ? `<div class="modal-row"><span class="label">Target</span><span class="value" style="color:var(--accent); font-weight:600;">${escapeHtml(parsed.targetUsername)}</span></div>` : ''}
      <div class="modal-row"><span class="label">Delivery URL</span><span class="value" style="font-size:12px; color:var(--info);">${escapeHtml(parsed ? parsed.targetUrl : pendingTarget)}</span></div>
      <div class="modal-row"><span class="label">Email</span><span class="value">${escapeHtml(pendingEmail)}</span></div>
      ${pendingPhone ? `<div class="modal-row"><span class="label">Phone</span><span class="value">${escapeHtml(pendingPhone)}</span></div>` : ''}
      <div class="modal-total"><span>Total</span><span>${formatRupees(selection.price)}</span></div>
      
      <button class="primary-btn glass-btn" id="payBtn">Pay with Cashfree</button>
      <p class="field-error" id="payError"></p>
      <div class="secure-note">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v5c0 5-3.5 8.5-8 9.5C7.5 19.5 4 16 4 11V6l8-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        100% Encrypted & processed by Cashfree Payments
      </div>
    `;

    document.getElementById("backBtn").addEventListener("click", openDetailsStep);
    document.getElementById("payBtn").addEventListener("click", () => startPayment(parsed));
    modalBackdrop.classList.add("open");
  }

  // ------------------------------------------------------------------
  // LIVE CASHFREE PAYMENT GATEWAY INTEGRATION
  // ------------------------------------------------------------------
  async function startPayment(parsed){
    const payBtn = document.getElementById("payBtn");
    const payError = document.getElementById("payError");
    payBtn.disabled = true;
    payError.textContent = "";
    payBtn.innerHTML = `<span class="spinner"></span> Connecting to Cashfree…`;

    const orderId = generateOrderId();
    const isUser = !!currentUser;
    const targetData = parsed || parseTarget(selection.cat, pendingTarget);

    const orderData = {
      orderId: orderId,
      customerType: isUser ? "user" : "guest",
      userId: isUser ? currentUser.uid : null,
      customerDetails: {
        email: pendingEmail.toLowerCase(),
        phone: pendingPhone || "",
        name: currentUser ? (currentUser.displayName || "") : ""
      },
      email: pendingEmail.toLowerCase(),
      phone: pendingPhone || "",
      service: `Instagram ${DATA[selection.cat].label}`,
      platform: "Instagram",
      quantity: selection.qty,
      price: selection.price,
      targetUsername: targetData.targetUsername || "",
      targetUrl: targetData.targetUrl || pendingTarget,
      paymentStatus: "Pending",     // Initially Pending until verified
      orderStatus: "Processing",   // Pending, Processing, Completed, Cancelled
      estDelivery: DATA[selection.cat].estTime,
      date: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }),
      createdAtIso: new Date().toISOString()
    };

    try {
      // 1. Create order on Cashfree server
      const res = await fetch("/api/create-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          orderId: orderId,
          orderAmount: selection.price,
          customerEmail: pendingEmail.toLowerCase(),
          customerPhone: pendingPhone || "9999999999",
          customerName: (currentUser && currentUser.displayName) || "Customer"
        })
      });

      const sessionData = await res.json();
      if (!res.ok || !sessionData.payment_session_id) {
        throw new Error(sessionData.error || "Unable to initiate payment session with Cashfree.");
      }

      payBtn.innerHTML = `<span class="spinner"></span> Opening Checkout…`;

      if (typeof Cashfree === "undefined") {
        throw new Error("Cashfree SDK failed to load. Please check your internet connection.");
      }

      // 2. Open Cashfree Hosted / Modal Checkout
      const cashfree = Cashfree({ mode: "production" });

      cashfree.checkout({
        paymentSessionId: sessionData.payment_session_id,
        redirectTarget: "_modal"
      }).then(async (result) => {
        if (result.error) {
          console.error("Cashfree checkout error:", result.error);
          payError.textContent = result.error.message || "Payment cancelled or closed.";
          payBtn.disabled = false;
          payBtn.innerHTML = "Pay with Cashfree";
          return;
        }

        // On modal close or redirect details, verify payment
        payBtn.innerHTML = `<span class="spinner"></span> Verifying payment…`;

        let isPaid = false;
        try {
          const verifyRes = await fetch(`/api/verify-order?orderId=${encodeURIComponent(orderId)}`).then(r => r.json());
          if (verifyRes.isPaid || verifyRes.order_status === "PAID") {
            isPaid = true;
          }
        } catch (vErr) {
          console.warn("Verify endpoint note:", vErr);
        }

        if (isPaid || result.paymentDetails) {
          orderData.paymentStatus = "Paid";
        }

        // 3. Play harmonic success chime (Paytm / GPay style)
        playSuccessChime();

        // 4. Save locally to browser localStorage for guest retrieval
        saveLocalOrder(orderData);

        // 5. Store in Cloud Firestore orders collection for Admin Panel view
        if (db) {
          try {
            await db.collection("orders").doc(orderId).set({
              ...orderData,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            updateLocalOrder(orderId, { synced: true });
          } catch (err) {
            console.error("Firestore order creation:", err);
          }
        }

        showSuccess(orderData);
      });

    } catch (err) {
      console.error("Payment initiation error:", err);
      payError.textContent = err.message || "Failed to connect to Cashfree payment gateway.";
      payBtn.disabled = false;
      payBtn.innerHTML = "Pay with Cashfree";
    }
  }

  function showSuccess(order){
    modal.innerHTML = `
      <div class="success-wrap">
        <svg class="success-ring-wrap" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="35"/>
          <path d="M27 43l10 10 20-22"/>
        </svg>
        <p class="success-title">Payment successful</p>
        <p class="success-amount">${formatRupees(order.price)}</p>
        <p class="success-sub">${order.service} · ${order.quantity}</p>
        
        <div class="success-card">
          <div class="order-id-bar">
            <span class="order-id-display">${order.orderId}</span>
            <button class="copy-btn" onclick="copyOrderId('${order.orderId}', this)">
              <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="1.8"/></svg>
              Copy ID
            </button>
          </div>
          ${order.targetUsername ? `<div class="modal-row"><span class="label">Target</span><span class="value" style="color:var(--accent); font-weight:600;">${escapeHtml(order.targetUsername)}</span></div>` : ''}
          <div class="modal-row"><span class="label">Delivery URL</span><span class="value" style="font-size:12px; color:var(--info);">${escapeHtml(order.targetUrl)}</span></div>
          <div class="modal-row"><span class="label">Payment</span><span class="value status-badge status-completed">🟢 Paid</span></div>
          <div class="modal-row" style="border-bottom:none;"><span class="label">Order Status</span><span class="value status-badge status-processing">🟡 Processing</span></div>
        </div>

        <button class="primary-btn glass-btn" id="doneBtn" style="margin-top:18px;">View my orders</button>
        <button class="secondary-btn" id="doneBtn2">Done</button>
      </div>
    `;

    const finish = () => {
      closeModal();
      selection = null;
      renderList();
      updateCheckoutBar();
    };

    document.getElementById("doneBtn").addEventListener("click", () => {
      finish();
      document.querySelector('.tab-btn[data-page="pageOrders"]').click();
    });
    document.getElementById("doneBtn2").addEventListener("click", finish);
  }

  function closeModal(){ modalBackdrop.classList.remove("open"); }
  modalBackdrop.addEventListener("click", (e) => { if(e.target === modalBackdrop) closeModal(); });

  // Init default category: Likes
  setActiveCat("likes");
</script>
